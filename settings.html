<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    :root { --surface: #22262c; --control: #2d333b; --hover: #39414b; --text: #f1f4f3; --muted: #9da7ad; --accent: #78c7b5; --warm: #e58b62; }
    html, body { margin: 0; background: var(--surface); color: var(--text); font: 13px "Trebuchet MS", "Segoe UI", sans-serif; }
    body { padding: 16px; }
    header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
    .eyebrow { color: var(--accent); font-size: 10px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; }
    h1 { margin: 3px 0 0; font-size: 18px; letter-spacing: .2px; }
    .section { margin-top: 10px; }
    .section-label { display: block; margin: 0 0 6px 2px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    button { width: 100%; border: 0; border-radius: 8px; background: var(--control); color: var(--text); cursor: pointer; padding: 9px 10px; text-align: left; font: inherit; transition: background .15s, transform .15s; }
    button:hover { background: var(--hover); transform: translateY(-1px); }
    .action { display: flex; align-items: center; gap: 9px; }
    .action-icon { display: grid; width: 22px; height: 22px; place-items: center; border-radius: 6px; background: rgba(120, 199, 181, .16); color: var(--accent); font-weight: 700; }
    .danger { margin-top: 6px; color: #f0b09a; }
    .danger .action-icon { background: rgba(229, 139, 98, .16); color: var(--warm); }
    .danger:hover { background: rgba(229, 139, 98, .22); color: #ffd7c9; }
    .options { display: flex; gap: 6px; }
    .options button { padding: 8px 4px; text-align: center; color: var(--muted); }
    .options .selected { background: var(--accent); color: #15221f; font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <div><div class="eyebrow">Workspace controls</div><h1>SwitchCord</h1></div>
  </header>
  <div class="section">
    <span class="section-label">Actions</span>
    <button class="action" onclick="openGitHub()"><span class="action-icon">↗</span><span>View on GitHub</span></button>
    <button class="action danger" onclick="closeAllAccounts()"><span class="action-icon">×</span><span>Close all accounts</span></button>
  </div>
  <div class="section">
    <span class="section-label">Navigation layout</span>
    <div class="options">
      <button id="top" onclick="setMode('top')">Top tabs</button>
      <button id="sidebar" onclick="setMode('sidebar')">Icon rail</button>
    </div>
  </div>
  <script>
    const { ipcRenderer } = require('electron');
    function closeWindow() { ipcRenderer.send('close-settings'); }
    function openGitHub() { ipcRenderer.send('open-github'); }
    function closeAllAccounts() {
      if (confirm('Close all accounts?')) {
        ipcRenderer.send('close-all-tabs');
        closeWindow();
      }
    }
    function setMode(mode) {
      ipcRenderer.send('set-navbar-mode', mode);
      document.getElementById('top').classList.toggle('selected', mode === 'top');
      document.getElementById('sidebar').classList.toggle('selected', mode === 'sidebar');
    }
    ipcRenderer.on('settings-state', (event, state) => setMode(state.navbarMode));
  </script>
</body>
</html>
